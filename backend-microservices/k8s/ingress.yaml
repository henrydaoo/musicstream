apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-stream-ingress
  namespace: music-stream
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.139.59.220.120.nip.io
    - grafana.139.59.220.120.nip.io
    secretName: music-stream-tls
  rules:
  - host: api.139.59.220.120.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
  - host: grafana.139.59.220.120.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 80
